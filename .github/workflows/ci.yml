name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # uv.lock is the reproducibility contract. This is the gate that catches a
      # pyproject.toml edit that was never followed by a lock regeneration.
      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # tests/test_e2e_spa.py is the only coverage of a real browser launch, a real
      # interaction-gated capture, and a real CDP attach against a running browser.
      # It used to skip silently here, which is indistinguishable from having no
      # coverage of the capture engine at all.
      - name: Install Chromium for the browser e2e
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (ruff format)
        run: uv run ruff format --check tests/

      - name: Type check (mypy)
        run: uv run mypy tests astrolabe

      - name: Test (pytest, with coverage gate)
        run: |
          set -o pipefail
          # No -q here: addopts already supplies it, and a second one makes this
          # `-qq`, which deletes the summary line this step reads the skip count from.
          uv run pytest -rs 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          # A skip is a test that did not run, and `-q` buries the count. Surface
          # the summary as an annotation and list every skip with its reason, so
          # "1200 passed, 5 skipped" can never be read as "everything ran".
          summary=$(grep -E '^[0-9]+ passed' "$RUNNER_TEMP/pytest.log" | tail -1)
          echo "::notice title=pytest::$summary"
          if echo "$summary" | grep -q 'skipped'; then
            echo "::warning title=pytest skips::$summary"
          fi
          grep -E '^SKIPPED' "$RUNNER_TEMP/pytest.log" || echo "no skips"

      - name: Assert the async MCP tests actually ran
        run: |
          # 25 of these 36 tests are coroutines that only execute because
          # asyncio_mode = "auto" is set in pyproject.toml. That setting is the
          # only thing making them run, so assert the count: a revert has to fail
          # the build rather than quietly leave half the MCP surface untested.
          out=$(uv run pytest tests/test_unified_mcp.py --no-cov -p no:cacheprovider)
          echo "$out"
          echo "$out" | grep -qE '^36 passed' || {
            echo "::error::expected 36 passed from test_unified_mcp.py; asyncio_mode = \"auto\" in pyproject.toml is what makes its 25 async tests execute. Bump this count in ci.yml if the file legitimately gained or lost a test."
            exit 1
          }
