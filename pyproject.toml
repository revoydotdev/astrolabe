[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrolabe"
version = "0.1.0"
description = "Authenticated API / GraphQL / REST / WebSocket surface mapping for arbitrary sites, with capture-driven typed MCP toolpack generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "revelri" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
keywords = ["graphql", "recon", "mcp", "model-context-protocol", "api", "web"]

dependencies = [
    # FastMCP 4 is built on the official Python MCP SDK v2 line; the two are
    # coupled, so they move together.
    "mcp>=2.2,<3",
    "fastmcp>=4.0.10,<5",
    "curl-cffi>=0.7",
    "requests>=2.31",
    "jsonschema>=4.23",
    "graphql-core>=3.2,<4",
    "websockets>=15,<18",
    "h11>=0.16,<1",
    "playwright>=1.40",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
]

[project.urls]
Homepage = "https://github.com/revoydotdev/astrolabe"
Repository = "https://github.com/revoydotdev/astrolabe"

[project.scripts]
astrolabe = "astrolabe.cli:main"
astrolabe-mcp = "astrolabe.mcp_server:main_sync"
astrolabe-mapping-mcp = "astrolabe.mapping_mcp:main"
astrolabe-unified-mcp = "astrolabe.unified_mcp:main"

[project.optional-dependencies]
browser-auth = ["cryptography>=43", "secretstorage>=3.3; sys_platform == 'linux'", "publicsuffixlist>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-jsonschema>=4.23",
    "pytest-asyncio>=1.0",
    # The MCP SDK moved its HTTP stack to httpx2, which drops httpx from the
    # dependency tree. tests/test_mcp_server.py still drives a local Starlette
    # ASGI app directly rather than through the SDK transport, so it needs httpx
    # as a direct dev dependency or it fails to import wherever cloakbrowser
    # (its only other requirer) is not installed, such as CI.
    "httpx>=0.28",
]
stealth = [
    "cloakbrowser[geoip]>=0.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["astrolabe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Treat async test functions as pytest-asyncio tests automatically. Existing
# tests that explicitly carry ``@pytest.mark.asyncio`` are still valid.
asyncio_mode = "auto"
# Measure the whole production package, not a cherry-picked subset. The floor was
# 65; the suite measures 73.46%, so it is raised to 70 to keep a regression from
# hiding behind a floor that was never binding. Never lower it.
addopts = "--cov=astrolabe --cov-fail-under=70 -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "E501"]
# Inherited baseline from the private source tree this was extracted from;
# every other selected rule (including all of ARG) stays enforced. Shrink
# this list as debt is paid down; never add newly-introduced codes to it.
# Still open, with the work each one implies: E501 42 long lines (needs a
# production `ruff format` pass), I001 25 unsorted import blocks (same pass,
# mostly), N806 10 non-lowercase locals, SIM105 13 try/except/pass,
# SIM115 28 open-in-try.
"astrolabe/*" = ["E501", "SIM115", "SIM105", "I001", "N806"]

[[tool.mypy.overrides]]
# cloakbrowser is a private capture-host driver that lives only on the remote
# capture host; it is deliberately not installed in this dev/CI environment.
module = "cloakbrowser"
ignore_missing_imports = true
